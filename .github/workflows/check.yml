name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install toolchain
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build the committed artifacts
        run: npm run build
      - name: The committed bundle matches src/
        run: git diff --exit-code -- client.js index.js
      - name: Bundle and manifest checks
        run: node scripts/check-bundle.cjs
      - name: i18n parity and bundle embedding
        run: node scripts/check-i18n.cjs
      # The file list lives in package.json so a new test file cannot be silently skipped here:
      # this step used to enumerate the files and so missed test/github.test.cjs.
      - name: Unit and regression tests
        run: npm test
      - name: Syntax
        run: |
          node --check client.js
          node --check index.js
