name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install toolchain
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build the committed artifacts
        run: npm run build
      - name: The committed bundle matches src/
        run: git diff --exit-code -- client.js index.js
      # One entry point for the repository checks (bundle, i18n, screenshots) so a check added
      # to `npm run check` cannot be missing here — the same enumeration mistake the test step below
      # warns about. Type check still runs as its own step so its failure is named clearly.
      - name: Repository checks (bundle, i18n, screenshots)
        run: npm run check
      # The file list lives in package.json so a new test file cannot be silently skipped here:
      # this step used to enumerate the files and so missed test/github.test.cjs.
      - name: Unit and regression tests
        run: npm test
      - name: Syntax
        run: |
          node --check client.js
          node --check index.js
